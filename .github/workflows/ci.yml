name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: rakeshmed
          POSTGRES_USER: rakeshmed
          POSTGRES_PASSWORD: rakeshmed
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U rakeshmed -d rakeshmed"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGO_SECRET_KEY: ci-secret-key
      DJANGO_DEBUG: "False"
      POSTGRES_DB: rakeshmed
      POSTGRES_USER: rakeshmed
      POSTGRES_PASSWORD: rakeshmed
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5433"
      REDIS_URL: redis://127.0.0.1:6379/0
      CELERY_BROKER_URL: redis://127.0.0.1:6379/0
      CELERY_RESULT_BACKEND: redis://127.0.0.1:6379/1
      DJANGO_CORS_ALLOWED_ORIGINS: http://localhost:3000
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:3000
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: apps/api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r apps/api/requirements.txt

      - name: Django system checks
        run: npm run check:api

      - name: Migration drift check
        run: npm run check:migrations:api

      - name: Backend test suite
        run: npm run test:api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck web app
        run: npm run typecheck:web

      - name: Build web app
        run: npm run build:web
