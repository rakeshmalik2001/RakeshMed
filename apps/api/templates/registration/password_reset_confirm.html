{% extends "portal/base.html" %}

{% block content %}
<div class="container portal-shell d-flex align-items-center justify-content-center py-5">
    <div class="auth-card p-4 p-md-5 col-lg-5">
        <h1 class="h4 mb-3">Choose a new password</h1>
        <form method="post">
            {% csrf_token %}
            {% for field in form %}
                <div class="mb-3">
                    <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% if field.errors %}<div class="text-danger small mt-1">{{ field.errors|join:", " }}</div>{% endif %}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Update password</button>
        </form>
    </div>
</div>
{% endblock %}
